<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometry on even coordinates so the 24 px rendering lands on whole pixels.
       16 px uses the hand-tuned app-16.svg (see scripts/make_icon.py). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B8AE0"/>
      <stop offset="1" stop-color="#0B4F94"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bg)"/>
  <!-- log lines; the highlighted one is the call you were looking for -->
  <rect x="10" y="10" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="10" y="18" width="28" height="6" rx="3" fill="#FFC857"/>
  <rect x="10" y="28" width="12" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- lens -->
  <circle cx="32" cy="33" r="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M36.5 37.5 L41 42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
