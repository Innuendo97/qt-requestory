<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-tuned 16 px variant of app.svg: at that size three lines and the lens
       merge into a blur, so it keeps the highlighted line, one plain line and a
       lens that does not touch them, all on whole pixels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B8AE0"/>
      <stop offset="1" stop-color="#0B4F94"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <rect x="3" y="3" width="10" height="2" rx="1" fill="#FFC857"/>
  <rect x="3" y="7" width="4" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="10.5" cy="10" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <path d="M12.5 12 L14 13.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>
