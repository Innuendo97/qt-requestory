[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrequestory"
version = "1.3.0"
description = "Mirror, search and extract document-generator request logs (nginx daily logs) — desktop tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pypdfium2>=4.30,<5"]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.scripts]
qtrequestory = "qtrequestory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Without this the SVG icons are left out of the wheel (and out of the
# PyInstaller collect_data_files that reads it), and the built application shows
# a rail with no icons at all. LICENSE.md is the Fluent UI attribution the MIT
# licence of those icons requires us to ship next to them. icons/app.ico is the
# generated Windows icon resource (scripts/make_icon.py): nothing reads it at
# runtime, but it must travel with the sources so a build never has to
# regenerate it.
[tool.setuptools.package-data]
"qtrequestory.ui" = ["icons/*.svg", "icons/*.ico", "icons/LICENSE.md"]
# The third-party notice (pypdfium2/PDFium, PySide6/Qt), bundled in the exe too.
"qtrequestory" = ["THIRD-PARTY-NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
